[project]
name = "tribonds"
version = "0.1.0"
description = "LLM word connection benchmark — TriBonds"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=1.4.6",
    "langchain-google-genai>=2.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "nltk>=3.9",
]

[project.scripts]
tribonds = "main:main"
